services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: bash
    container_name: doctrine-utils-app
    volumes:
      - .:/app
      - ./vendor:/app/vendor
    entrypoint: []
    command: [ "bash", "-c", "composer install --no-ansi --no-interaction --no-progress && sleep infinity" ]
    tty: true
    stdin_open: true
